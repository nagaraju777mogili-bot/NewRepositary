<template>
    <lightning-card title="ApexWireMethodToProperty" icon-name="custom:custom63">
      <div class="slds-var-m-around_medium">
        <template lwc:if={contacts.data}>
          <template for:each={contacts.data} for:item="contact">
            <p key={contact.Id}>{contact.Name}</p>
          </template>
        </template>
        <template lwc:elseif={contacts.error}>
        </template>
      </div>
    </lightning-card>

    <lightning-card title="ApexWireMethodToFunction" icon-name="custom:custom63">
        <div class="slds-var-m-around_medium">
          <template lwc:if={wiredContacts}>
            <template for:each={wiredContacts} for:item="contact">
              <p key={contact.Id}>{contact.Name}</p>
            </template>
          </template>
          <template lwc:elseif={contacts.error}>
          </template>
        </div>
      </lightning-card >

      <lightning-card title= "Search the Records Using Input value" icon-name="custom:custom63">
            <div class="slds-var-m-around_medium">
                <lightning-input value={accountName} title="Account Name" label="Account Name" onchange={getAccountsData}></lightning-input>
            </div>
            <template lwc:if={contactsData.data}>
                <template for:each={contactsData.data} for:item="contact">
                  <p key={contact.Id}>{contact.Name}</p>
                </template>
              </template>
            
      </lightning-card>
  </template>
